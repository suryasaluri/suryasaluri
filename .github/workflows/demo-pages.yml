name: Deploy prospect demo to GitHub Pages

on:
  push:
    branches: [claude/practical-newton-1fbhzi]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - name: Build static demo bundle
        run: bun run build:demo
        env:
          VITE_SUPABASE_URL: https://pukrjkjszlsvtenqmefd.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB1a3Jqa2pzemxzdnRlbnFtZWZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxMTE4MTUsImV4cCI6MjEwNDY4NzgxNX0.6YjXJw54264c-pxtanP9p1ijRGYIWOiIQ074605fUDk
          VITE_SUPABASE_PROJECT_ID: pukrjkjszlsvtenqmefd
          DEMO_BASE_PATH: /suryasaluri/
          DEMO_OUT_DIR: .output-demo

      # GitHub Pages has no server-side rewrites: it falls back to 404.html for
      # any unmatched path, so copying the SPA shell there keeps deep links
      # (e.g. a reload on /admin/inventory) working instead of 404ing.
      - name: Add SPA fallback (404 -> index)
        run: cp .output-demo/client/index.html .output-demo/client/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output-demo/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
